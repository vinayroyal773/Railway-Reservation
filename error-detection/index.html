<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Railway Reservation - Error Detection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Railway Reservation</h1>
        <h2>Error Detection Module</h2>

        <p class="description">
            Detect transmission errors in railway reservation data
            using CRC (Cyclic Redundancy Check).
        </p>

        <!-- Original Data -->

        <div class="section">

            <label for="originalData">
                Reservation Data
            </label>

            <textarea
                id="originalData"
                placeholder="Enter reservation data..."></textarea>

            <button onclick="generateCRC()">
                Generate CRC
            </button>

            <div class="result-box">

                <strong>Generated CRC:</strong>

                <span id="generatedCRC">
                    -
                </span>

            </div>

        </div>


        <!-- Received Data -->

        <div class="section">

            <label for="receivedData">
                Received Data
            </label>

            <textarea
                id="receivedData"
                placeholder="Enter received data..."></textarea>

            <label for="receivedCRC">
                Received CRC
            </label>

            <input
                type="text"
                id="receivedCRC"
                placeholder="Enter received CRC">

            <button onclick="checkError()">
                Check for Error
            </button>

        </div>


        <!-- Result -->

        <div id="status" class="status"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
